[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediamap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
]

[project.scripts]
mediamap = "mediamap.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["mediamap*"]
