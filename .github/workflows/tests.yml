name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install numpy joblib python-dotenv requests umap-learn

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check CLI entry points
        run: |
          python -m mediamap --help
          python -m mediamap books --help
          python -m mediamap cds --help
          python -m mediamap lps --help
